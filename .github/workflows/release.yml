# Publish to npm when a version tag is pushed.
#
# Authentication: npm trusted publishing (OIDC) only. The workflow proves its
# identity to the registry (hence `permissions.id-token: write`); there is no
# token secret and nothing to log in to. The trust relationship is configured
# once per package (npm-oidc-setup.sh, or npmjs.com -> package -> Settings ->
# Trusted Publisher -> GitHub Actions, this repository, release.yml).
#
# Every release publishes straight to `latest`, prereleases included: in this
# 0.x line each rc is the version users should get, and OIDC can only set the
# tag of the publish itself (moving a dist-tag afterwards would need a login).
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
      contents: write   # create the matching GitHub release after npm succeeds
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reads the exact pnpm version from package.json#packageManager, so local,
      # CI and release installs all use the same lockfile implementation.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The npm bundled with setup-node predates the automatic OIDC exchange
      # (11.5) that trusted publishing relies on. Pinned to the major so a
      # future npm (which may e.g. reject setup-node's `always-auth` npmrc
      # key it currently only warns about) cannot break a release out of
      # nowhere.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # The tag must match what is about to be published, or the release
      # silently ships a version nobody asked for.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      # Rebuild the committed client bundle from the tagged sources and run
      # the full test suite before touching the registry: lib/client.js is
      # what the DSH host loads, and a stale copy would ship unnoticed.
      #
      # This duplicates `prepack` (build + typecheck + tests), which
      # npm runs again inside `npm publish` below. The duplication is
      # deliberate:
      # - a failure surfaces here, in a labeled step with clean test output,
      #   before any registry interaction — not buried in npm's publish
      #   lifecycle logs;
      # - this step is immune to npm lifecycle settings (`ignore-scripts`)
      #   that can make `npm publish` skip prepack and ship the stale
      #   committed bundle;
      # - prepack remains the safety net for releases published outside this
      #   workflow, where no CI step runs. Two independent gates, each
      #   covering a path the other might miss; the price is one extra
      #   build+test run when a publish actually happens.
      - name: Build and test the bundle
        run: pnpm run build:client && pnpm run typecheck && pnpm test

      # Exercise the artifact an external user receives: pack it, install it
      # with plain npm in an empty directory, import the public entry, and run
      # the installed CLI. prepublishOnly repeats this for manual publishes.
      - name: Smoke the packed install
        run: pnpm run smoke:pack

      # Publishing is skipped when the registry already has this version.
      # npm refuses to publish over an existing version, so without the guard
      # a re-pushed tag — or a version first published by hand — turns the
      # release red for a reason nobody needs to act on.
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          pkg="$(node -p "require('./package.json').version")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "$name@$pkg is already on the registry — nothing to publish."
            exit 0
          fi
          # Keep the flag as a release-log assertion even though package.json
          # also declares publishConfig.access=public for manual publishes.
          npm publish --access public --tag latest

      - name: Create the matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            ## English

            This release was built and verified from the matching tag. Install from npm with `npm i @zseven-w/dsh-harbor` (every release, prereleases included, is published as `latest`). See `README.md` for installation, usage, evidence levels, and known limits.

            ## 简体中文

            本版本由同名 tag 构建并完成验收。通过 `npm i @zseven-w/dsh-harbor` 安装（每个版本，含候选版本，都发布为 `latest`）。安装、用法、证据等级与已知边界见 `README.zh.md`。
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          pkg="$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists — nothing to create."
            exit 0
          fi
          flags=(--verify-tag --generate-notes --notes "$RELEASE_NOTES")
          case "$pkg" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "$tag" --title "dsh-harbor $pkg" "${flags[@]}"
