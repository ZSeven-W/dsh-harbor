# Publish to npm when a version tag is pushed.
#
# Authentication, in preference order:
# 1. npm trusted publishing (OIDC) — the workflow proves its identity to the
#    registry, which is why `permissions.id-token` is present. One-time setup
#    on npmjs.com, under the package's Settings -> Trusted Publisher: pick
#    GitHub Actions, then name this repository and this file (release.yml).
# 2. The NPM_TOKEN repository secret — npm >= 11.5 falls back to it when the
#    OIDC exchange is unavailable (no trusted publisher configured yet). The
#    token must be an Automation (or granular publish) token, or npm will
#    demand a one-time password no CI run can type.
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # dsh-harbor's package.json has no `packageManager` field, so
      # pnpm/action-setup has nothing to read a version from: pin the major
      # here explicitly instead of depending on its fallback behavior. 11 is
      # what produced the committed pnpm-lock.yaml (lockfileVersion 9.0).
      - uses: pnpm/action-setup@v4
        with:
          version: '11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The npm bundled with setup-node predates the automatic OIDC exchange
      # (11.5) that trusted publishing relies on. Pinned to the major so a
      # future npm (which may e.g. reject setup-node's `always-auth` npmrc
      # key it currently only warns about) cannot break a release out of
      # nowhere.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # The tag must match what is about to be published, or the release
      # silently ships a version nobody asked for.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      # Rebuild the committed client bundle from the tagged sources and run
      # the full test suite before touching the registry: lib/client.js is
      # what the DSH host loads, and a stale copy would ship unnoticed.
      #
      # This duplicates `prepack` (npm run build:client && npm test), which
      # npm runs again inside `npm publish` below. The duplication is
      # deliberate:
      # - a failure surfaces here, in a labeled step with clean test output,
      #   before any registry interaction — not buried in npm's publish
      #   lifecycle logs;
      # - this step is immune to npm lifecycle settings (`ignore-scripts`)
      #   that can make `npm publish` skip prepack and ship the stale
      #   committed bundle;
      # - prepack remains the safety net for releases published outside this
      #   workflow, where no CI step runs. Two independent gates, each
      #   covering a path the other might miss; the price is one extra
      #   build+test run when a publish actually happens.
      - name: Build and test the bundle
        run: pnpm run build:client && pnpm test

      # A prerelease must never take the `latest` dist-tag: `npm install`
      # with no version would hand it to everyone.
      #
      # Publishing is skipped when the registry already has this version.
      # npm refuses to publish over an existing version, so without the guard
      # a re-pushed tag — or a version first published by hand — turns the
      # release red for a reason nobody needs to act on.
      - name: Publish
        env:
          # Fallback credential for the OIDC-less case; setup-node's npmrc
          # references exactly this variable. npm tries the trusted-publishing
          # exchange first and only then reads the token, so configuring the
          # trusted publisher later needs no workflow change.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          pkg="$(node -p "require('./package.json').version")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "$name@$pkg is already on the registry — nothing to publish."
            exit 0
          fi
          case "$pkg" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          # @zseven-w/... is scoped, and npm publishes scoped packages as
          # restricted unless told otherwise; harbor's package.json sets no
          # publishConfig.access, so this flag is what keeps the package
          # publicly installable.
          npm publish --access public --tag "$dist_tag"
